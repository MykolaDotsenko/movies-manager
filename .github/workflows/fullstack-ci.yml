name: Full-stack CI

on:
  push:
    branches:
      - master
      - "refactor/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend · Angular build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend · .NET build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore MoviesAPI.sln

      - name: Build
        run: dotnet build MoviesAPI.sln --configuration Release --no-restore
